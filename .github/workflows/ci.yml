name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Fusion ships Python 3.12; test the oldest supported and current.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests
        run: python tests/test_payloads.py

  release:
    name: Publish release ZIP
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check manifest version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(python -c "import json;print(json.load(open('QRPlate.manifest'))['version'])")
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "Tag $TAG does not match manifest version $MANIFEST" >&2
            exit 1
          fi

      - name: Build add-in ZIP
        run: |
          mkdir -p dist/QRPlate
          rsync -a --exclude '.git' --exclude '.github' --exclude 'dist' \
                --exclude '__pycache__' --exclude '.gitignore' \
                ./ dist/QRPlate/
          cd dist && zip -r "../QRPlate-${GITHUB_REF_NAME}.zip" QRPlate

      - name: Attach ZIP to the release
        uses: softprops/action-gh-release@v2
        with:
          files: QRPlate-${{ github.ref_name }}.zip
          generate_release_notes: true
